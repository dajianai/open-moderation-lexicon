name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real user content into this form.

        If a term matched when it should not have, or did not match when it should have,
        use the "False positive or false negative" template instead — that is a data
        question rather than a bug.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I called moderator.check('...') with mode 'exact' and got start=4, but the term
        begins at code point 2.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest snippet or command that shows the problem.
      render: typescript
      placeholder: |
        import { createModerator } from 'open-moderation-lexicon';

        const moderator = await createModerator({ mode: 'exact' });
        console.log(moderator.check('🎉🎉法轮功').matches);
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v22.13.0
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - SDK
        - REST API
        - CLI
        - Lexicon build or sync scripts
        - Docker image
    validations:
      required: true

  - type: textarea
    id: metadata
    attributes:
      label: Lexicon metadata
      description: |
        Output of `npx oml metadata --json`, or `GET /v1/metadata`. Tells us which
        lexicon version and category selection you are on.
      render: json

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that this is not a false positive or false negative report
          required: true
        - label: My example contains no real user content
          required: true
