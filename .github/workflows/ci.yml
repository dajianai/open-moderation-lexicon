name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.x is the current Active LTS; 24.x is the next one, tested early.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate lexicon
        run: npm run lexicon:validate

      - name: Verify the packed tarball
        run: npm pack --dry-run

  lexicon-reproducible:
    name: Lexicon build is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # Rebuilding from the committed data/upstream must reproduce the committed
      # artifact byte for byte. If it does not, either the artifact was edited by
      # hand or the builder is not deterministic.
      - name: Rebuild and diff
        run: |
          npm run lexicon:build
          if ! git diff --quiet -- data/generated; then
            echo "::error::data/generated does not match a fresh build from data/upstream"
            git --no-pager diff --stat -- data/generated
            exit 1
          fi
          echo "data/generated reproduced exactly"

      - name: OpenAPI document is up to date
        run: |
          npm run build
          npm run openapi:generate
          if ! git diff --quiet -- openapi.json; then
            echo "::error::openapi.json is stale; run npm run openapi:generate"
            git --no-pager diff -- openapi.json
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: open-moderation-lexicon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds but cannot serve a request is not a passing build.
      - name: Smoke test the image
        run: |
          docker run -d --name oml -p 3000:3000 open-moderation-lexicon:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then break; fi
            sleep 1
          done

          echo "--- /health"
          curl -fsS http://localhost:3000/health | tee /tmp/health.json
          grep -q '"loaded":true' /tmp/health.json

          echo "--- /v1/metadata"
          curl -fsS http://localhost:3000/v1/metadata > /dev/null

          echo "--- /v1/moderate (clean)"
          curl -fsS -X POST http://localhost:3000/v1/moderate \
            -H 'content-type: application/json' \
            -d '{"text":"测试文本"}' | tee /tmp/clean.json
          grep -q '"matched":false' /tmp/clean.json

          echo "--- /v1/moderate (match)"
          curl -fsS -X POST http://localhost:3000/v1/moderate \
            -H 'content-type: application/json' \
            -d '{"text":"这段文本提到了法轮功组织","options":{"mask":true}}' | tee /tmp/hit.json
          grep -q '"matched":true' /tmp/hit.json
          grep -q '"decision":"review"' /tmp/hit.json

          echo "--- error envelope"
          curl -s -o /tmp/err.json -w '%{http_code}' -X POST http://localhost:3000/v1/moderate \
            -H 'content-type: application/json' -d '{}' | grep -q 400
          grep -q '"code":"TEXT_REQUIRED"' /tmp/err.json

          echo "--- runs as non-root"
          test "$(docker exec oml id -u)" != "0"

      - name: Container logs
        if: always()
        run: docker logs oml || true

      - name: Stop
        if: always()
        run: docker rm -f oml || true
